<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Mentors</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        .header {
            background-color: #2563eb;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .back-btn {
            background-color: white;
            color: #2563eb;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 40px;
        }

        .container h2 {
            margin-top: 0;
        }

        #mentorContainer {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .mentor-card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .mentor-card h3 {
            margin-top: 0;
            color: #2563eb;
        }

        .mentor-card p {
            margin: 8px 0;
        }

        .mentor-card button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        .mentor-card button:hover {
            background-color: #1d4ed8;
        }

        .message {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 900px) {

            #mentorContainer {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            #mentorContainer {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            .header {
                padding: 15px 20px;
            }

        }

    </style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* LearnSphere shared styles — link this in every page */
:root{--bg:#f7f2e8;--card:#fffdf8;--ink:#1f2e27;--primary:#2c5a45;--primary-ink:#fbf8f1;--accent:#a94f20;--muted:#59635e;--border:#e6dccb;--radius:16px;--shadow:0 20px 50px -24px rgba(44,90,69,.45)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1040px;padding:48px 24px 80px;background:var(--bg);color:var(--ink);font:16px/1.6 "Manrope",system-ui,sans-serif;animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;color:var(--primary);line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:.3em}
h1::before{content:"LearnSphere.";display:block;font-size:1rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-family:"Manrope",sans-serif;font-weight:700;margin-bottom:12px}
h2{font-size:1.7rem;margin-top:1.4em}
h3{font-size:1.2rem}
p{color:var(--muted);margin:.4em 0}
strong{color:var(--ink)}
a{color:var(--accent);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
hr{border:0;border-top:1px solid var(--border);margin:32px 0}
br+br{display:none}
button,input[type=submit]{display:inline-flex;align-items:center;gap:8px;margin:6px 8px 6px 0;padding:12px 24px;border:0;border-radius:999px;background:var(--primary);color:var(--primary-ink);font:600 15px "Manrope",sans-serif;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,background .2s}
button:hover{transform:translateY(-2px);background:var(--accent)}
button:disabled{opacity:.75;cursor:not-allowed;transform:none}
label{display:block;font-weight:600;font-size:14px;margin:18px 0 6px;color:var(--ink)}
input,select,textarea{width:100%;max-width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink);font:15px "Manrope",sans-serif;transition:border .2s,box-shadow .2s}
textarea{border-radius:var(--radius);resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(44,90,69,.15)}
form{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px;margin:16px 0}
form br{display:none}
form button[type=submit]{margin-top:24px}
/* Cards for lists loaded by script */
#courseContainer>div,#courses>section,#contentContainer>div,#certificatesContainer>div,.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin:16px 0;transition:transform .2s,box-shadow .2s}
#courseContainer>div:hover,#courses>section:hover,#contentContainer>div:hover,#certificatesContainer>div:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
#courses>section hr{display:none}
#courseContainer>div h2,#courses>section h2{margin-top:0;font-size:1.35rem}
#message{font-weight:600;color:var(--accent)}
#studentInfo,#mentorInfo{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-weight:600}
img{border-radius:8px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden}
th,td{padding:12px 16px;border-bottom:1px solid var(--border);text-align:left}
th{background:var(--primary);color:var(--primary-ink)}
@media(max-width:600px){body{padding:28px 16px}form{padding:20px}button{width:100%;justify-content:center}}

#courseContainer{display:grid;gap:16px}
#courseContainer>h2{margin-bottom:0}
#courseContainer>div{margin:0}
[id$=Container]>div,[id$=List]>div{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin:16px 0;transition:transform .2s,box-shadow .2s}
[id$=Container]>div:hover,[id$=List]>div:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
</style>
<style>
.header{background:transparent;color:var(--ink);padding:0 0 24px;border-bottom:1px solid var(--border);margin-bottom:32px}
.header .back-btn{background:var(--primary);color:var(--primary-ink);border:0;padding:12px 24px;border-radius:999px;font:600 15px "Manrope",sans-serif;box-shadow:var(--shadow)}
.header .back-btn:hover{background:var(--accent)}
.container{padding:0}
#mentorContainer{grid-template-columns:repeat(3,minmax(0,1fr))}
.mentor-card h3{color:var(--primary)}
.mentor-card button{background:var(--primary);color:var(--primary-ink);border-radius:999px;font:600 15px "Manrope",sans-serif;box-shadow:var(--shadow)}
.mentor-card button:hover{background:var(--accent)}
.message{grid-column:1/-1;background:var(--card);border:1px solid var(--border)}
@media(max-width:900px){#mentorContainer{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.header{padding:0 0 20px}.header .back-btn{width:auto}#mentorContainer{grid-template-columns:1fr}}
</style>
</head>


<body>


<div class="header">

    <h1>Find Mentors</h1>

    <button
        class="back-btn"
        onclick="goBack()">
        Back to Dashboard
    </button>

</div>


<div class="container">

    <h2>Approved Technical Mentors</h2>

    <div id="mentorContainer">

        <div class="message">
            Loading mentors...
        </div>

    </div>

</div>


<script>

    const studentId =
        localStorage.getItem("studentId");


    // Student must be logged in

    if (!studentId) {

        window.location.href =
            "student-login.html";

    }


    async function loadMentors() {

        const container =
            document.getElementById("mentorContainer");


        try {

            const response = await fetch(
                "/api/student-mentors/approved"
            );


            if (!response.ok) {

                container.innerHTML = `
                    <div class="message">
                        Unable to load mentors.
                    </div>
                `;

                return;
            }


            const mentors =
                await response.json();


            // No approved mentors

            if (mentors.length === 0) {

                container.innerHTML = `
                    <div class="message">
                        <h3>No approved mentors available</h3>
                        <p>
                            Approved mentors will appear here
                            after admin verification.
                        </p>
                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            mentors.forEach(function(mentor) {

                const card =
                    document.createElement("div");

                card.className = "mentor-card";


                const name =
                    mentor.fullName || "Not available";

                const education =
                    mentor.educationLevel || "Not specified";

                const specialization =
                    mentor.specialization || "Not specified";

                const experience =
                    mentor.yearsOfExperience || "Not specified";

                const skills =
                    mentor.skills || "Not specified";


                card.innerHTML = `

                    <h3>${name}</h3>

                    <p>
                        <strong>Education:</strong>
                        ${education}
                    </p>

                    <p>
                        <strong>Specialization:</strong>
                        ${specialization}
                    </p>

                    <p>
                        <strong>Experience:</strong>
                        ${experience}
                    </p>

                    <p>
                        <strong>Technical Skills:</strong>
                        ${skills}
                    </p>

                    <button
                        onclick="viewMentor(${mentor.id})">
                        View Profile
                    </button>

                `;

                const photo = document.createElement("img");
                photo.src = mentor.profilePhoto || "https://via.placeholder.com/96";
                photo.alt = `${name} profile photo`;
                photo.width = 96;
                photo.height = 96;
                photo.style.objectFit = "cover";
                photo.style.borderRadius = "50%";
                card.prepend(photo);

                const quality = document.createElement("p");
                quality.textContent = "Mentor Rating: Loading";
                card.appendChild(quality);
                fetch(`/api/mentor-feedback/quality/${mentor.id}`)
                    .then(response => response.ok ? response.json() : null)
                    .then(result => {
                        quality.textContent = result
                            ? `Mentor Rating: ${result.averageRating} / 5 (${result.reviewCount} reviews)`
                            : "No student feedback yet";
                    });

                fetch(`/api/courses/mentor/${mentor.id}`)
                    .then(response => response.ok ? response.json() : [])
                    .then(courses => {
                        const courseSummary = document.createElement("p");
                        courseSummary.textContent = courses.length
                            ? `Courses: ${courses.map(course => course.courseName).join(", ")}`
                            : "No courses published yet";
                        card.insertBefore(courseSummary, card.lastElementChild);
                    });


                container.appendChild(card);

            });


        } catch (error) {

            console.error(error);

            container.innerHTML = `
                <div class="message">
                    Unable to connect to the server.
                </div>
            `;

        }

    }


    function viewMentor(mentorId) {

        window.location.href =
            "view-mentor.html?mentorId=" + mentorId;

    }


    function goBack() {

        window.location.href =
            "student-dashboard.html";

    }


    loadMentors();

</script>


</body>

</html>
