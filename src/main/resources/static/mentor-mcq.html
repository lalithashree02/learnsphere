<!DOCTYPE html>
<html>

<head>
    <title>Mentor MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* LearnSphere shared styles — link this in every page */
:root{--bg:#f7f2e8;--card:#fffdf8;--ink:#1f2e27;--primary:#2c5a45;--primary-ink:#fbf8f1;--accent:#a94f20;--muted:#59635e;--border:#e6dccb;--radius:16px;--shadow:0 20px 50px -24px rgba(44,90,69,.45)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1040px;padding:48px 24px 80px;background:var(--bg);color:var(--ink);font:16px/1.6 "Manrope",system-ui,sans-serif;animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;color:var(--primary);line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:.3em}
h1::before{content:"LearnSphere.";display:block;font-size:1rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-family:"Manrope",sans-serif;font-weight:700;margin-bottom:12px}
h2{font-size:1.7rem;margin-top:1.4em}
h3{font-size:1.2rem}
p{color:var(--muted);margin:.4em 0}
strong{color:var(--ink)}
a{color:var(--accent);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
hr{border:0;border-top:1px solid var(--border);margin:32px 0}
br+br{display:none}
button,input[type=submit]{display:inline-flex;align-items:center;gap:8px;margin:6px 8px 6px 0;padding:12px 24px;border:0;border-radius:999px;background:var(--primary);color:var(--primary-ink);font:600 15px "Manrope",sans-serif;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,background .2s}
button:hover{transform:translateY(-2px);background:var(--accent)}
button:disabled{opacity:.75;cursor:not-allowed;transform:none}
label{display:block;font-weight:600;font-size:14px;margin:18px 0 6px;color:var(--ink)}
input,select,textarea{width:100%;max-width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink);font:15px "Manrope",sans-serif;transition:border .2s,box-shadow .2s}
textarea{border-radius:var(--radius);resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(44,90,69,.15)}
form{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px;margin:16px 0}
form br{display:none}
form button[type=submit]{margin-top:24px}
/* Cards for lists loaded by script */
#courseContainer>div,#courses>section,#contentContainer>div,#certificatesContainer>div,.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin:16px 0;transition:transform .2s,box-shadow .2s}
#courseContainer>div:hover,#courses>section:hover,#contentContainer>div:hover,#certificatesContainer>div:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
#courses>section hr{display:none}
#courseContainer>div h2,#courses>section h2{margin-top:0;font-size:1.35rem}
#message{font-weight:600;color:var(--accent)}
#studentInfo,#mentorInfo{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-weight:600}
img{border-radius:8px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden}
th,td{padding:12px 16px;border-bottom:1px solid var(--border);text-align:left}
th{background:var(--primary);color:var(--primary-ink)}
@media(max-width:600px){body{padding:28px 16px}form{padding:20px}button{width:100%;justify-content:center}}

#courseContainer{display:grid;gap:16px}
#courseContainer>h2{margin-bottom:0}
#courseContainer>div{margin:0}
[id$=Container]>div,[id$=List]>div{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin:16px 0;transition:transform .2s,box-shadow .2s}
[id$=Container]>div:hover,[id$=List]>div:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
</style>
</head>

<body>

    <h1>Mentor Verification - MCQ Test</h1>

    <p id="skillText"></p>

    <hr>

    <!-- This will show either the test or completed message -->
    <div id="testContainer">
        <p>Checking test status...</p>
    </div>

    <button id="submitButton"
            onclick="submitTest()"
            style="display:none;">
        Submit Test
    </button>

    <p id="message"></p>


<script>

const mentor = JSON.parse(localStorage.getItem("mentor"));

/* Check whether mentor is logged in */
if (!mentor) {

    alert("Please login first.");

    window.location.href = "mentor-login.html";
}

function getSkillList(skills) {
    if (Array.isArray(skills)) {
        return skills
            .map(skill => String(skill).trim())
            .filter(skill => skill.length > 0);
    }

    if (typeof skills === "string") {
        return skills
            .split(",")
            .map(skill => skill.trim())
            .filter(skill => skill.length > 0);
    }

    return [];
}

/* Get mentor's first selected skill */
const skillList = getSkillList(mentor.skills);
const skill = skillList[0];

if (!skill) {
    document.getElementById("skillText").textContent =
        "No skill is assigned to your mentor profile yet.";
    document.getElementById("testContainer").innerHTML =
        "<p>No skill is available for the MCQ test.</p>";
} else {
    document.getElementById("skillText").textContent =
        "Your MCQ test is based on your selected skill: " + skill;
}


let questions = [];


/* =========================================================
   CHECK WHETHER MCQ TEST IS ALREADY COMPLETED
   ========================================================= */

async function checkMCQStatus() {

    try {

        const response =
            await fetch(`/api/mcq/results/mentor/${mentor.id}`);


        /* -------------------------------------------------
           MCQ ALREADY COMPLETED
           ------------------------------------------------- */

        if (response.ok) {

            const result = await response.json();

            document.getElementById("testContainer").innerHTML = `

                <h2>MCQ Test Completed</h2>

                <p>
                    You have already completed the MCQ Test.
                </p>

                <p>
                    Score:
                    <strong>
                        ${result.score} / ${result.totalQuestions}
                    </strong>
                </p>

                <p>
                    Percentage:
                    <strong>
                        ${result.percentage}%
                    </strong>
                </p>

            `;

            /* Do not show questions */
            document.getElementById("submitButton")
                .style.display = "none";

            return;
        }


        /* -------------------------------------------------
           MCQ NOT COMPLETED
           ------------------------------------------------- */

        loadQuestions();


    } catch (error) {

        console.error(error);

        document.getElementById("testContainer").innerHTML =
            "<p>Unable to check MCQ test status.</p>";
    }
}


/* =========================================================
   LOAD MCQ QUESTIONS
   ========================================================= */

async function loadQuestions() {

    try {

        const response =
            await fetch(
                `/api/mcq/questions/skill/${encodeURIComponent(skill)}`
            );


        if (!response.ok) {

            throw new Error("Failed to load questions");
        }


        questions = await response.json();


        const container =
            document.getElementById("testContainer");


        container.innerHTML = "";


        /* No questions available */

        if (questions.length === 0) {

            container.innerHTML =
                "<p>No questions are available for your specialization yet.</p>";

            return;
        }


        /* Display every question */

        questions.forEach((question, index) => {

            const questionDiv =
                document.createElement("div");


            questionDiv.innerHTML = `

                <hr>

                <h3>
                    Question ${index + 1}
                </h3>

                <p>
                    <strong>
                        ${question.question}
                    </strong>
                </p>

                <label>
                    <input
                        type="radio"
                        name="question${question.id}"
                        value="A">
                    A. ${question.optionA}
                </label>

                <br><br>

                <label>
                    <input
                        type="radio"
                        name="question${question.id}"
                        value="B">
                    B. ${question.optionB}
                </label>

                <br><br>

                <label>
                    <input
                        type="radio"
                        name="question${question.id}"
                        value="C">
                    C. ${question.optionC}
                </label>

                <br><br>

                <label>
                    <input
                        type="radio"
                        name="question${question.id}"
                        value="D">
                    D. ${question.optionD}
                </label>

            `;


            container.appendChild(questionDiv);

        });


        /* Show submit button */

        document.getElementById("submitButton")
            .style.display = "block";


    } catch (error) {

        console.error(error);

        document.getElementById("testContainer").innerHTML =
            "<p>Unable to load the MCQ test.</p>";
    }
}


/* =========================================================
   SUBMIT MCQ TEST
   ========================================================= */

async function submitTest() {

    const answers = [];


    /* Get selected answer for every question */

    questions.forEach(question => {

        const selected =
            document.querySelector(
                `input[name="question${question.id}"]:checked`
            );


        if (selected) {

            answers.push({

                questionId: question.id,

                answer: selected.value

            });

        }

    });


    /* Make sure every question is answered */

    if (answers.length !== questions.length) {

        alert(
            "Please answer all questions before submitting."
        );

        return;
    }


    /* Prepare data */

    const testData = {

        mentorId: mentor.id,

        answers: answers

    };


    try {

        const response =
            await fetch(
                "/api/mcq/test/submit",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(testData)
                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to submit test"
            );
        }


        const result =
            await response.json();


        /* Show completed message */

        document.getElementById("testContainer").innerHTML = `

            <h2>MCQ Test Completed</h2>

            <p>
                You have successfully completed the MCQ Test.
            </p>

            <p>
                Score:
                <strong>
                    ${result.score} / ${result.totalQuestions}
                </strong>
            </p>

            <p>
                Percentage:
                <strong>
                    ${result.percentage}%
                </strong>
            </p>

        `;


        /* Hide submit button */

        document.getElementById("submitButton")
            .style.display = "none";


    } catch (error) {

        console.error(error);

        document.getElementById("message").textContent =
            "Unable to submit the test.";
    }
}


/* =========================================================
   START
   ========================================================= */

checkMCQStatus();

</script>

</body>

</html>
