<!DOCTYPE html>
<html>
<head>
    <title>Mentor Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* LearnSphere shared styles — link this in every page */
:root{--bg:#f7f2e8;--card:#fffdf8;--ink:#1f2e27;--primary:#2c5a45;--primary-ink:#fbf8f1;--accent:#a94f20;--muted:#59635e;--border:#e6dccb;--radius:16px;--shadow:0 20px 50px -24px rgba(44,90,69,.45)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1040px;padding:48px 24px 80px;background:var(--bg);color:var(--ink);font:16px/1.6 "Manrope",system-ui,sans-serif;animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;color:var(--primary);line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:.3em}
h1::before{content:"LearnSphere.";display:block;font-size:1rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-family:"Manrope",sans-serif;font-weight:700;margin-bottom:12px}
h2{font-size:1.7rem;margin-top:1.4em}
h3{font-size:1.2rem}
p{color:var(--muted);margin:.4em 0}
strong{color:var(--ink)}
a{color:var(--accent);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
hr{border:0;border-top:1px solid var(--border);margin:32px 0}
br+br{display:none}
button,input[type=submit]{display:inline-flex;align-items:center;gap:8px;margin:6px 8px 6px 0;padding:12px 24px;border:0;border-radius:999px;background:var(--primary);color:var(--primary-ink);font:600 15px "Manrope",sans-serif;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,background .2s}
button:hover{transform:translateY(-2px);background:var(--accent)}
button:disabled{opacity:.75;cursor:not-allowed;transform:none}
label{display:block;font-weight:600;font-size:14px;margin:18px 0 6px;color:var(--ink)}
input,select,textarea{width:100%;max-width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink);font:15px "Manrope",sans-serif;transition:border .2s,box-shadow .2s}
textarea{border-radius:var(--radius);resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(44,90,69,.15)}
form{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px;margin:16px 0}
form br{display:none}
form button[type=submit]{margin-top:24px}
/* Cards for lists loaded by script */
#courseContainer>div,#courses>section,#contentContainer>div,#certificatesContainer>div,.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin:16px 0;transition:transform .2s,box-shadow .2s}
#courseContainer>div:hover,#courses>section:hover,#contentContainer>div:hover,#certificatesContainer>div:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
#courses>section hr{display:none}
#courseContainer>div h2,#courses>section h2{margin-top:0;font-size:1.35rem}
#message{font-weight:600;color:var(--accent)}
#studentInfo,#mentorInfo{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-weight:600}
img{border-radius:8px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden}
th,td{padding:12px 16px;border-bottom:1px solid var(--border);text-align:left}
th{background:var(--primary);color:var(--primary-ink)}
@media(max-width:600px){body{padding:28px 16px}form{padding:20px}button{width:100%;justify-content:center}}

#courseContainer{display:grid;gap:16px}
#courseContainer>h2{margin-bottom:0}
#courseContainer>div{margin:0}
[id$=Container]>div,[id$=List]>div{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin:16px 0;transition:transform .2s,box-shadow .2s}
[id$=Container]>div:hover,[id$=List]>div:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
</style>
</head>

<body>

    <h1>Mentor Registration</h1>

    <form id="mentorForm">

        <h3>Personal Details</h3>

        <label>Full Name:</label><br>
        <input type="text" id="fullName" required>
        <br><br>

        <label>Email:</label><br>
        <input type="email" id="email" required>
        <br><br>

        <label>Password:</label><br>
        <input type="password" id="password" required>
        <br><br>

        <label>Phone Number:</label><br>
        <input type="text" id="phoneNumber" required>
        <br><br>


        <h3>Education Details</h3>

        <label>Education Level:</label><br>
        <select id="educationLevel" required>
            <option value="">Select Education Level</option>
            <option value="B.E / B.Tech">B.E / B.Tech</option>
            <option value="B.Sc">B.Sc</option>
            <option value="BCA">BCA</option>
            <option value="M.E / M.Tech">M.E / M.Tech</option>
            <option value="MCA">MCA</option>
            <option value="M.Sc">M.Sc</option>
            <option value="PhD">PhD</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <label>Field of Study:</label><br>
        <input type="text" id="fieldOfStudy" placeholder="Example: Information Technology" required>
        <br><br>

        <label>Institution Name:</label><br>
        <input type="text" id="institutionName" required>
        <br><br>

        <label>Education Status:</label><br>
        <select id="educationStatus" required>
            <option value="">Select Status</option>
            <option value="Completed">Completed</option>
            <option value="Currently Pursuing">Currently Pursuing</option>
        </select>
        <br><br>


        <h3>Professional Details</h3>

        <label>Years of Experience:</label><br>
        <select id="yearsOfExperience" required>
            <option value="">Select Experience</option>
            <option value="Fresher / Student">Fresher / Student</option>
            <option value="0-1 Years">0-1 Years</option>
            <option value="1-3 Years">1-3 Years</option>
            <option value="3-5 Years">3-5 Years</option>
            <option value="5-10 Years">5-10 Years</option>
            <option value="10+ Years">10+ Years</option>
        </select>
        <br><br>

        <label>Primary Specialization:</label><br>
        <select id="specialization" required>
            <option value="">Select Specialization</option>
            <option value="Frontend Development">Frontend Development</option>
            <option value="Backend Development">Backend Development</option>
            <option value="Full Stack Development">Full Stack Development</option>
            <option value="Mobile App Development">Mobile App Development</option>
            <option value="Data Science">Data Science</option>
            <option value="Machine Learning / AI">Machine Learning / AI</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Cloud Computing">Cloud Computing</option>
            <option value="DevOps">DevOps</option>
            <option value="Database Management">Database Management</option>
            <option value="Software Testing">Software Testing</option>
            <option value="Competitive Programming">Competitive Programming</option>
        </select>
        <br><br>


        <h3>Technical Skills</h3>

        <input type="checkbox" name="skills" value="Java"> Java<br>
        <input type="checkbox" name="skills" value="Python"> Python<br>
        <input type="checkbox" name="skills" value="C"> C<br>
        <input type="checkbox" name="skills" value="C++"> C++<br>
        <input type="checkbox" name="skills" value="JavaScript"> JavaScript<br>
        <input type="checkbox" name="skills" value="HTML"> HTML<br>
        <input type="checkbox" name="skills" value="CSS"> CSS<br>
        <input type="checkbox" name="skills" value="React"> React<br>
        <input type="checkbox" name="skills" value="Spring Boot"> Spring Boot<br>
        <input type="checkbox" name="skills" value="MySQL"> MySQL<br>
        <input type="checkbox" name="skills" value="MongoDB"> MongoDB<br>
        <input type="checkbox" name="skills" value="Machine Learning"> Machine Learning<br>
        <input type="checkbox" name="skills" value="Cybersecurity"> Cybersecurity<br>
        <input type="checkbox" name="skills" value="Cloud Computing"> Cloud Computing<br>
        <input type="checkbox" name="skills" value="DevOps"> DevOps<br>

        <br>

        <h3>Professional Profiles</h3>

        <label>LinkedIn Profile URL:</label><br>
        <input type="url" id="linkedinUrl">
        <br><br>

        <label>GitHub Profile URL:</label><br>
        <input type="url" id="githubUrl">
        <br><br>

        <button type="submit">Register</button>

    </form>

    <p id="message"></p>


    <script>
        document.getElementById("mentorForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            // Get all selected skills
            const selectedSkills = [];
            const skillCheckboxes = document.querySelectorAll('input[name="skills"]:checked');

            skillCheckboxes.forEach(function(skill) {
                selectedSkills.push(skill.value);
            });

            const mentor = {
                fullName: document.getElementById("fullName").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                phoneNumber: document.getElementById("phoneNumber").value,

                educationLevel: document.getElementById("educationLevel").value,
                fieldOfStudy: document.getElementById("fieldOfStudy").value,
                institutionName: document.getElementById("institutionName").value,
                educationStatus: document.getElementById("educationStatus").value,

                yearsOfExperience: document.getElementById("yearsOfExperience").value,
                specialization: document.getElementById("specialization").value,

                skills: selectedSkills,

                linkedinUrl: document.getElementById("linkedinUrl").value,
                githubUrl: document.getElementById("githubUrl").value
            };

            try {
                const response = await fetch("/api/mentors/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(mentor)
                });

                if (response.ok) {
                    document.getElementById("message").innerText =
                        "Mentor registered successfully!";

                    document.getElementById("mentorForm").reset();
                } else {
                    document.getElementById("message").innerText =
                        "Registration failed!";
                }

            } catch (error) {
                document.getElementById("message").innerText =
                    "Error connecting to server!";
            }
        });
    </script>

</body>
</html>
